name: manobal
metadata:
  template: manobal@0.1.0
infra:
  provider: bicep
  path: infra/bicep
  module: main.bicep
services:
  engine:
    project: ./services/engine
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
  vault:
    project: ./services/vault
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
  web:
    project: ./apps/web
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
  realtime:
    project: ./infra/realtime
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
