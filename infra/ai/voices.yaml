# Voice names and STT models. Verify against provider docs at setup.
# Saathi speaks as one woman. Every TTS voice and fallback is female.
# Deepgram flux-meena-en returns 400, so English uses the same Azure voice as Hindi.
stt:
  en:
    provider: deepgram
    model: nova-3
    language: en
    end_of_turn: flux
  hi:
    provider: deepgram
    model: nova-3
    language: hi
    keyterms: true
  hi-Latn:
    provider: deepgram
    model: nova-3
    language: multi
    keyterms: true
    transliterate: true
  ta:
    provider: azure
    locale: ta-IN
  bn:
    provider: azure
    locale: bn-IN
  te:
    provider: azure
    locale: te-IN
  mr:
    provider: azure
    locale: mr-IN
  kn:
    provider: azure
    locale: kn-IN
  ml:
    provider: azure
    locale: ml-IN
  gu:
    provider: azure
    locale: gu-IN
  pa:
    provider: azure
    locale: pa-IN
  or:
    provider: azure
    locale: or-IN
  as:
    provider: azure
    locale: as-IN
  ur:
    provider: azure
    locale: ur-IN

tts:
  en:
    provider: azure
    voice: hi-IN-SwaraNeural
    style: empathetic
    gender: female
    fallback: en-IN-NeerjaNeural
    fallback_provider: azure
  hi:
    provider: azure
    voice: hi-IN-SwaraNeural
    style: empathetic
    gender: female
    fallback: hi-IN-AnanyaNeural
    fallback_provider: azure
  hi-Latn:
    provider: azure
    voice: hi-IN-SwaraNeural
    style: empathetic
    gender: female
    fallback: hi-IN-AnanyaNeural
    fallback_provider: azure
  ta:
    provider: azure
    voice: ta-IN-PallaviNeural
    gender: female
    fallback: hi-IN-SwaraNeural
    fallback_provider: azure

keyterms:
  - MANOBAL
  - Saathi
  - roster
  - duty
  - chutti
  - EL
  - CL
  - company
  - platoon
  - post
  - battalion
  - welfare officer
  - counsellor
  - Tele-MANAS
