[project]
name = "manobal-synth"
version = "0.1.0"
description = "Deterministic synthetic world generator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faker>=37.6.0",
  "httpx>=0.28.1",
  "numpy>=2.3.2",
  "polars>=1.33.1",
  "psycopg[binary]>=3.2.10",
  "pydantic>=2.11.9",
  "sqlalchemy>=2.0.43",
  "typer>=0.17.4",
]

[project.scripts]
synth = "manobal_synth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manobal_synth"]
