[project]
name = "manobal-vault"
version = "0.1.0"
description = "Isolated identity tokenisation and resolution service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.5",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.10",
  "azure-identity>=1.25.0",
  "azure-postgresql-auth[asyncpg,psycopg3,sqlalchemy]>=1.0.0",
  "azure-keyvault-keys>=4.11.0",
  "azure-keyvault-secrets>=4.10.0",
  "aiohttp>=3.12.0",
  "cryptography>=45.0.7",
  "fastapi>=0.116.1",
  "pydantic>=2.11.9",
  "pydantic-settings>=2.10.1",
  "pyjwt[crypto]>=2.10.1",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
