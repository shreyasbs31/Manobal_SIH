[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "manobal-synth"
version = "0.1.0"
description = "MANOBAL causal synthetic data generator — injected ground truth, partial consent, realistic missingness."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "manobal-risk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[project.scripts]
manobal-synth = "manobal_synth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manobal_synth = ["py.typed"]
