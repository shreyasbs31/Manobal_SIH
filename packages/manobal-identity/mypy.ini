; Type-checking configuration for the Zone 3 identity enclave.
;
; The enclave needs its own config for the same reason it needs its own pytest
; session: django-stubs resolves model attributes by loading a settings module,
; and there is exactly one such setting per config file. The root config points
; at manobal_core.settings.local, which does not — and must not — list the vault
; app, so `SubjectIdentity.objects` would resolve to nothing there.
;
; The alternative, adding the vault app to the Zone 2 INSTALLED_APPS purely to
; satisfy the type checker, would put the enclave's models inside the analytics
; service. A second config file is a much smaller price than a hole in §3.2.
;
; Run via `make typecheck`, which invokes mypy once per zone.

[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
plugins = mypy_django_plugin.main
exclude = migrations/

[mypy.plugins.django-stubs]
django_settings_module = manobal_identity.settings.local

[mypy-pytest_django.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True
