[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "manobal-core"
version = "0.1.0"
description = "MANOBAL Zone 2 modular monolith — API, ingest, consent, cases, alerting, aggregation."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "kombu>=5.4",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "manobal-risk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "hypothesis>=6.112",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manobal_core = ["py.typed", "apps/authz/dev_issuer.pem"]
