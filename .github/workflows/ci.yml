name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: |
          uv sync --all-packages
          corepack pnpm install
      - name: Development keys
        # DEV_VAULT_KEYS_JSON is optional. Without it CI uses a random token key
        # and skips only the tests that assert fixed demo-persona tokens.
        env:
          DEV_VAULT_KEYS_JSON: ${{ secrets.DEV_VAULT_KEYS_JSON }}
        run: uv run python scripts/ci-dev-keys.py
      - name: Lint
        run: make lint
      - name: Copy lint
        run: python3 scripts/copy-lint
      - name: Tests and evals
        run: make test
